<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="login-card">
    <div class="top-avatar" aria-hidden="true">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
    </div>

    <div id="alertBox" class="alert" role="alert"></div>

    <!-- Tela de Login -->
    <form id="loginForm" autocomplete="off">
      <div class="pill-input">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#555555">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>
        </span>
        <input type="text" id="loginIdentifier" required placeholder="Usuário ou E-mail" />
      </div>

      <div class="pill-input">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#555555">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
        </span>
        <input type="password" id="loginPassword" required placeholder="Senha" />
      </div>

      <div class="form-options">
        <label class="remember">
          <input type="checkbox" id="rememberMe" />
          <span>Lembrar-me</span>
        </label>
        <button type="button" class="link-btn" id="goRegister">Criar conta</button>
      </div>

      <button type="submit" class="btn-pill">LOGIN</button>
    </form>

    <!-- Tela de Cadastro -->
    <form id="registerForm" class="hidden" autocomplete="off">
      <div class="pill-input">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#555555">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>
        </span>
        <input type="text" id="regUsername" required placeholder="Usuário (3-20 caracteres)" />
      </div>

      <div class="pill-input">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#555555">
            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </span>
        <input type="email" id="regEmail" required placeholder="E-mail" />
      </div>

      <div class="pill-input">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#555555">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
        </span>
        <input type="password" id="regPassword" required placeholder="Senha (mín. 8, Aa1)" />
      </div>

      <div class="pill-input">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#555555">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
        </span>
        <input type="password" id="regConfirm" required placeholder="Confirmar senha" />
      </div>

      <div class="form-options single-right">
        <button type="button" class="link-btn" id="goLogin">Já tenho conta</button>
      </div>

      <button type="submit" class="btn-pill">CADASTRAR</button>
    </form>

    <!-- Tela Logada -->
    <section id="profileSection" class="hidden">
      <div class="user-info">
        <h2 id="profUser">Usuário</h2>
        <p id="profEmail">email@exemplo.com</p>
        <span class="role-tag" id="profRole">USER</span>
      </div>
      <button type="button" class="btn-pill btn-out" id="logoutBtn">SAIR</button>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
